---
name: CI

# yamllint disable-line rule:truthy
on:
  push:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint YAML files
        run: yamllint .github .yamllint

  build:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: rockylinux:10
      options: --privileged
    steps:
      - name: Install Mock
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install \
            https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
          dnf -y install \
            curl \
            mock \
            rpm-build \
            tar

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create source tarball
        id: source
        run: |
          version="$(rpm -q --specfile smbkrb5pwd.spec --qf '%{VERSION}\n' | sort -u)"
          archive="smbkrb5pwd-${version}.tar.gz"
          mkdir -p "$RUNNER_TEMP/sources"
          tar -czf "$RUNNER_TEMP/sources/$archive" \
            --transform='s,^,smbkrb5pwd/,' \
            LICENSE Makefile README.md smbkrb5pwd.c
          curl --fail --location --retry 3 \
            "https://openldap.org/software/download/OpenLDAP/openldap-release/openldap-${version}.tgz" \
            --output "$RUNNER_TEMP/sources/openldap-${version}.tgz"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build SRPM with Mock
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          mock -r centos-stream+epel-10-x86_64 \
            --buildsrpm \
            --spec=smbkrb5pwd.spec \
            --sources="$RUNNER_TEMP/sources" \
            --resultdir="$RUNNER_TEMP/results"

      - name: Build RPM with Mock
        run: |
          srpm="$(find "$RUNNER_TEMP/results" -type f -name '*.src.rpm' -print -quit)"
          test -n "$srpm"
          mock -r centos-stream+epel-10-x86_64 \
            --rebuild "$srpm" \
            --resultdir="$RUNNER_TEMP/results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: smbkrb5pwd-${{ steps.source.outputs.version }}
          path: |
            ${{ runner.temp }}/sources/smbkrb5pwd-*.tar.gz
            ${{ runner.temp }}/results/*.rpm
          if-no-files-found: error
